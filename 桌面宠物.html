// --- 颜色映射 ---
const COLORS = {
  1: '#8B5CF6',  // 身体主色（紫色）
  2: '#7C3AED',  // 身体暗色（深紫，做体积感）
  3: '#FFFFFF',  // 眼睛白色
  4: '#FDE047',  // 嘴巴/强调色（黄色）
};

// --- 所有精灵帧的集合 ---
const SPRITES = {
  idle: [IDLE_0, IDLE_1],
  blink: [BLINK_FRAME],
  happy: [HAPPY_FRAME],
  angry: [ANGRY_FRAME],
  bored: [BORED_FRAME],
  walk: [WALK_0, WALK_1, WALK_2, WALK_3],
};



class Pet {
  constructor(canvasWidth, canvasHeight) {
    this.x = canvasWidth / 2 - PET_SIZE / 2;
    this.y = canvasHeight - PET_SIZE;
    this.vx = 0;
    this.vy = 0;

    // Animation
    this.animation = 'idle';       // 'idle' | 'walk' | 'blink' | 'happy' | 'angry' | 'bored'
    this.frameIndex = 0;
    this.frameTimer = 0;
    this.facingRight = true;

    // Walk AI
    this.walkDirection = 0;        // -1 left, 0 still, 1 right
    this.walkTimer = 0;

    // Blink
    this.blinkTimer = BLINK_INTERVAL_MIN
      + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
    this.isBlinking = false;

    // Mood
    this.mood = 'idle';            // 'idle' | 'happy' | 'angry' | 'bored'
    this.moodTimer = 0;
    this.clickTimes = [];          // 记录最近的点击时间戳
    this.lastInteractionTime = Date.now();

    // Drag state
    this.isDragging = false;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;

    // Idle float
    this.floatOffset = 0;
  }

  /**
   * 更新动画状态和帧
   * @param {number} dt — delta time in seconds
   */
  updateAnimation(dt) {
    // 待机浮动：用 sin 波做上下浮动
    if (this.animation === 'idle') {
      this.floatOffset = Math.sin(Date.now() / (IDLE_FLOAT_PERIOD / (Math.PI * 2)))
        * IDLE_FLOAT_AMPLITUDE;
    } else {
      this.floatOffset = 0;
    }

    // 眨眼计时器
    if (this.isBlinking) {
      this.blinkTimer -= dt * 1000;
      if (this.blinkTimer <= 0) {
        this.isBlinking = false;
        this.animation = 'idle';
        this.blinkTimer = BLINK_INTERVAL_MIN
          + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
      }
    } else {
      this.blinkTimer -= dt * 1000;
      if (this.blinkTimer <= 0) {
        this.isBlinking = true;
        this.animation = 'blink';
        this.blinkTimer = BLINK_DURATION;
      }
    }

    // 帧切换
    this.frameTimer += dt * 1000;
    const duration = FRAME_DURATION;
    if (this.frameTimer >= duration) {
      this.frameTimer -= duration;
      this.frameIndex++;
    }
  }

  /**
   * 走路 AI：随机改变方向和状态
   * @param {number} dt — delta time in seconds
   * @param {number} canvasWidth — world width
   */
  updateWalk(dt, canvasWidth) {
    // 非待机状态或正在拖拽时，不走路
    if (this.mood !== 'idle' || this.isDragging) {
      if (this.animation === 'walk') {
        this.animation = 'idle';
        this.vx = 0;
      }
      return;
    }

    this.walkTimer -= dt * 1000;

    if (this.walkTimer <= 0) {
      const r = Math.random();
      if (r < 0.4) {
        // 40% 概率停下来
        this.walkDirection = 0;
        this.animation = 'idle';
        this.vx = 0;
      } else if (r < 0.7) {
        // 30% 概率向左走
        this.walkDirection = -1;
        this.facingRight = false;
        this.animation = 'walk';
        this.vx = -WALK_SPEED;
      } else {
        // 30% 概率向右走
        this.walkDirection = 1;
        this.facingRight = true;
        this.animation = 'walk';
        this.vx = WALK_SPEED;
      }
      this.walkTimer = 1000 + Math.random() * 3000;
    }

    // 边界检测：走到屏幕边缘就回头
    if (this.x <= 0) {
      this.walkDirection = 1;
      this.facingRight = true;
      this.vx = WALK_SPEED;
      this.walkTimer = 1000 + Math.random() * 2000;
    } else if (this.x + PET_SIZE >= canvasWidth) {
      this.walkDirection = -1;
      this.facingRight = false;
      this.vx = -WALK_SPEED;
      this.walkTimer = 1000 + Math.random() * 2000;
    }
  }
}




/**
 * 把一帧像素数据画到 Canvas 上
 *
 * @param {CanvasRenderingContext2D} ctx — Canvas 的绘制上下文
 * @param {import('./pet.js').Pet} pet — 宠物实例
 * @param {number} canvasWidth — 画布宽度
 * @param {number} canvasHeight — 画布高度
 */
function render(ctx, pet, canvasWidth, canvasHeight) {
  // 1. 清空整张画布
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);

  // 2. 根据宠物的动画状态和帧序号，拿到当前要画的像素数据
  const frames = SPRITES[pet.animation] || SPRITES.idle;
  const frameData = frames[pet.frameIndex % frames.length];

  // 3. 每个像素是一个 PET_SCALE × PET_SCALE 的方块
  const pixelSize = PET_SCALE;

  // 4. 遍历 16×16 的像素数组，逐个画方块
  for (let row = 0; row < PET_PIXEL_SIZE; row++) {
    for (let col = 0; col < PET_PIXEL_SIZE; col++) {
      const colorIndex = frameData[row][col];
      if (colorIndex === 0) continue; // 透明，跳过

      const color = COLORS[colorIndex];
      if (!color) continue;

      ctx.fillStyle = color;

      // 如果宠物朝左，水平翻转列号
      const drawCol = pet.facingRight ? col : (PET_PIXEL_SIZE - 1 - col);

      ctx.fillRect(
        pet.x + drawCol * pixelSize,
        pet.y + row * pixelSize + (pet.floatOffset || 0),
        pixelSize,
        pixelSize
      );
    }
  }
}



/**
 * 应用重力和地面碰撞
 *
 * @param {import('./pet.js').Pet} pet
 * @param {number} dt — delta time in seconds
 * @param {number} canvasHeight — world height
 */
function applyGravity(pet, dt, canvasHeight) {
  // 拖拽时不应用重力（由 input.js 控制位置）
  if (pet.isDragging) return;

  const groundY = canvasHeight - PET_SIZE;

  // 重力加速：每秒速度增加 GRAVITY px/s
  pet.vy += GRAVITY * dt;

  // 用速度更新位置
  pet.y += pet.vy * dt;

  // 地面碰撞：穿透了就拉回来
  if (pet.y >= groundY) {
    pet.y = groundY;
    pet.vy = 0;
  }
}



/**
 * 每帧调用，根据互动历史更新宠物的情绪状态
 *
 * 优先级规则（按顺序检查）：
 *   1. 连续快速点击过多 → 生气（最高优先）
 *   2. 生气冷却时间到 → 恢复待机
 *   3. 刚被点击 → 开心
 *   4. 开心冷却时间到 → 恢复待机
 *   5. 长时间没互动 → 无聊
 *   6. 无聊状态下被互动 → 恢复待机
 *
 * @param {import('./pet.js').Pet} pet
 * @param {number} dt — delta time in seconds
 */
function updateMood(pet, dt) {
  const now = Date.now();

  // 清理 3 秒前的点击记录
  pet.clickTimes = pet.clickTimes.filter(t => now - t < CLICK_ANGER_WINDOW);

  // 规则1：连续快速点击过多 → 生气
  if (pet.clickTimes.length >= CLICK_ANGER_THRESHOLD && pet.mood !== 'angry') {
    pet.mood = 'angry';
    pet.moodTimer = ANGER_COOLDOWN;
    pet.animation = 'angry';
    pet.frameIndex = 0;
    pet.walkTimer = 0;
    return;
  }

  // 规则2：生气冷却结束 → 待机
  if (pet.mood === 'angry') {
    pet.moodTimer -= dt * 1000;
    if (pet.moodTimer <= 0) {
      pet.mood = 'idle';
      pet.moodTimer = 0;
      pet.animation = 'idle';
      pet.clickTimes = [];
      pet.walkTimer = 0;
    }
    return;
  }

  // 规则3：刚被点击 → 开心
  if (pet.clickTimes.length > 0 && pet.mood !== 'happy') {
    const lastClick = pet.clickTimes[pet.clickTimes.length - 1];
    if (now - lastClick < 500) {
      pet.mood = 'happy';
      pet.moodTimer = HAPPY_COOLDOWN;
      pet.animation = 'happy';
      pet.frameIndex = 0;
      pet.walkTimer = 0;
      return;
    }
  }

  // 规则4：开心冷却结束 → 待机
  if (pet.mood === 'happy') {
    pet.moodTimer -= dt * 1000;
    if (pet.moodTimer <= 0) {
      pet.mood = 'idle';
      pet.moodTimer = 0;
      pet.animation = 'idle';
      pet.walkTimer = 0;
    }
    return;
  }

  // 规则5：太久没互动 → 无聊
  if (now - pet.lastInteractionTime > BORED_TIMEOUT && pet.mood !== 'bored') {
    pet.mood = 'bored';
    pet.animation = 'bored';
    pet.frameIndex = 0;
    return;
  }

  // 规则6：无聊状态下被互动 → 立刻恢复
  if (pet.mood === 'bored' && now - pet.lastInteractionTime < 1000) {
    pet.mood = 'idle';
    pet.animation = 'idle';
  }
}



/**
 * 判断一个坐标点是否在宠物身上
 */
function isInsidePet(px, py, pet) {
  return (
    px >= pet.x &&
    px <= pet.x + PET_SIZE &&
    py >= pet.y &&
    py <= pet.y + PET_SIZE
  );
}

/**
 * 给 Canvas 绑定鼠标事件：点击反应 + 拖拽
 *
 * @param {HTMLCanvasElement} canvas
 * @param {import('./pet.js').Pet} pet
 */
function setupInput(canvas, pet) {
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (isInsidePet(mx, my, pet)) {
      pet.isDragging = true;
      pet.dragOffsetX = mx - pet.x;
      pet.dragOffsetY = my - pet.y;
      pet.vy = -150; // 点击时向上弹跳一下

      // 记录点击时间戳用于情绪判断
      pet.clickTimes.push(Date.now());
      const cutoff = Date.now() - 3000;
      pet.clickTimes = pet.clickTimes.filter(t => t > cutoff);

      pet.lastInteractionTime = Date.now();
    }
  });

  // 拖拽移动 — 绑定在 window 上，防止鼠标移出 Canvas 范围丢事件
  window.addEventListener('mousemove', (e) => {
    if (!pet.isDragging) return;

    const rect = canvas.getBoundingClientRect();
    pet.x = e.clientX - rect.left - pet.dragOffsetX;
    pet.y = e.clientY - rect.top - pet.dragOffsetY;
  });

  // 松开放下宠物，重力接管
  window.addEventListener('mouseup', () => {
    pet.isDragging = false;
  });
}







// 获取 Canvas 和绘制上下文
const canvas = document.getElementById('pet-canvas');
const ctx = canvas.getContext('2d');

// 让 Canvas 填满窗口
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 创建宠物实例 + 绑定输入
const pet = new Pet(canvas.width, canvas.height);
setupInput(canvas, pet);

// 游戏主循环
let lastTime = 0;

function gameLoop(timestamp) {
  // delta time（秒）— 距上一帧过了多久，上限 0.1 防止切标签页后瞬移
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  // 情绪状态机
  updateMood(pet, dt);

  // 更新动画
  pet.updateAnimation(dt);

  // 走路 AI
  pet.updateWalk(dt, canvas.width);

  // 更新位置（水平由走路控制，垂直由物理引擎控制）
  pet.x += pet.vx * dt;
  applyGravity(pet, dt, canvas.height);

  // 渲染
  render(ctx, pet, canvas.width, canvas.height);

  requestAnimationFrame(gameLoop);
}

// 启动循环
requestAnimationFrame(gameLoop);


</script>
