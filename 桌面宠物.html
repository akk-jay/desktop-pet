class Pet {
  constructor(canvasWidth, canvasHeight) {
    this.x = canvasWidth / 2 - PET_SIZE / 2;
    this.y = canvasHeight - PET_SIZE;
    this.vx = 0;
    this.vy = 0;

    // Animation
    this.animation = 'idle';
    this.frameIndex = 0;
    this.frameTimer = 0;
    this.facingRight = true;

    // Walk AI
    this.walkDirection = 0;
    this.walkTimer = 0;

    // Blink
    this.blinkTimer = BLINK_INTERVAL_MIN
      + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
    this.isBlinking = false;

    // Mood: 'idle' | 'happy' | 'angry' | 'resting' | 'still'
    this.mood = 'idle';
    this.moodTimer = 0;
    this.clickTimes = [];
    this.lastInteractionTime = Date.now();

    // Drag state
    this.isDragging = false;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;

    // Idle float
    this.floatOffset = 0;

    // Energy system
    this.energy = MAX_ENERGY;
    this.restSide = 0; // 0=左墙, 1=右墙
  }

  /**
   * 更新动画状态和帧
   */
  updateAnimation(dt) {
    // 纯苹果和休息状态不需要浮动
    if (this.animation === 'idle') {
      this.floatOffset = Math.sin(Date.now() / (IDLE_FLOAT_PERIOD / (Math.PI * 2)))
        * IDLE_FLOAT_AMPLITUDE;
    } else {
      this.floatOffset = 0;
    }

    // 休息和纯苹果状态不眨眼
    if (this.mood === 'resting' || this.mood === 'still') {
      return;
    }

    if (this.isBlinking) {
      this.blinkTimer -= dt * 1000;
      if (this.blinkTimer <= 0) {
        this.isBlinking = false;
        this.animation = 'idle';
        this.blinkTimer = BLINK_INTERVAL_MIN
          + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
      }
    } else {
      this.blinkTimer -= dt * 1000;
      if (this.blinkTimer <= 0) {
        this.isBlinking = true;
        this.animation = 'blink';
        this.blinkTimer = BLINK_DURATION;
      }
    }

    this.frameTimer += dt * 1000;
    if (this.frameTimer >= FRAME_DURATION) {
      this.frameTimer -= FRAME_DURATION;
      this.frameIndex++;
    }
  }

  /**
   * 走路 AI：随机改变方向和状态
   */
  updateWalk(dt, canvasWidth) {
    // 非待机/拖拽时不走路
    if (this.mood !== 'idle' || this.isDragging) {
      if (this.animation === 'walk') {
        this.animation = 'idle';
        this.vx = 0;
      }
      return;
    }

    this.walkTimer -= dt * 1000;

    if (this.walkTimer <= 0) {
      const r = Math.random();
      if (r < 0.3) {
        // 30% 停下来
        this.walkDirection = 0;
        this.animation = 'idle';
        this.vx = 0;
      } else if (r < 0.65) {
        // 35% 向左走
        this.walkDirection = -1;
        this.facingRight = false;
        this.animation = 'walk';
        this.vx = -WALK_SPEED;
      } else {
        // 35% 向右走
        this.walkDirection = 1;
        this.facingRight = true;
        this.animation = 'walk';
        this.vx = WALK_SPEED;
      }
      this.walkTimer = 1500 + Math.random() * 3500;
    }

    // 边界反弹
    if (this.x <= 0) {
      this.walkDirection = 1;
      this.facingRight = true;
      this.vx = WALK_SPEED;
      this.walkTimer = 1000 + Math.random() * 2000;
    } else if (this.x + PET_SIZE >= canvasWidth) {
      this.walkDirection = -1;
      this.facingRight = false;
      this.vx = -WALK_SPEED;
      this.walkTimer = 1000 + Math.random() * 2000;
    }
  }

  /**
   * 体力系统：走路耗体力
   */
  updateEnergy(dt) {
    if (this.mood === 'resting') {
      // 休息恢复
      this.energy += ENERGY_RECOVER_RATE * dt;
      if (this.energy >= MAX_ENERGY) {
        this.energy = MAX_ENERGY;
      }
      return;
    }

    if (this.animation === 'walk' && !this.isDragging) {
      this.energy -= ENERGY_DRAIN_RATE * dt;
      if (this.energy < 0) {
        this.energy = 0;
      }
    } else if (this.animation !== 'walk') {
      // 不动时缓慢恢复
      this.energy += ENERGY_RECOVER_RATE * 0.3 * dt;
      if (this.energy > MAX_ENERGY) {
        this.energy = MAX_ENERGY;
      }
    }
  }

  /**
   * 跑去最近的墙边休息
   */
  moveToNearestWall(canvasWidth) {
    const distToLeft = this.x;
    const distToRight = canvasWidth - PET_SIZE - this.x;

    if (distToLeft < distToRight) {
      // 去左墙
      this.facingRight = false;
      this.walkDirection = -1;
      this.restSide = 0;
    } else {
      // 去右墙
      this.facingRight = true;
      this.walkDirection = 1;
      this.restSide = 1;
    }
  }
}




/**
 * 把一帧像素数据画到 Canvas 上
 *
 * @param {CanvasRenderingContext2D} ctx — Canvas 的绘制上下文
 * @param {import('./pet.js').Pet} pet — 宠物实例
 * @param {number} canvasWidth — 画布宽度
 * @param {number} canvasHeight — 画布高度
 */
function render(ctx, pet, canvasWidth, canvasHeight) {
  // 1. 清空整张画布
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);

  // 2. 根据宠物的动画状态和帧序号，拿到当前要画的像素数据
  const frames = SPRITES[pet.animation] || SPRITES.idle;
  const frameData = frames[pet.frameIndex % frames.length];

  // 3. 每个像素是一个 PET_SCALE × PET_SCALE 的方块
  const pixelSize = PET_SCALE;

  // 4. 遍历 16×16 的像素数组，逐个画方块
  for (let row = 0; row < PET_PIXEL_SIZE; row++) {
    for (let col = 0; col < PET_PIXEL_SIZE; col++) {
      const colorIndex = frameData[row][col];
      if (colorIndex === 0) continue; // 透明，跳过

      const color = COLORS[colorIndex];
      if (!color) continue;

      ctx.fillStyle = color;

      // 如果宠物朝左，水平翻转列号
      const drawCol = pet.facingRight ? col : (PET_PIXEL_SIZE - 1 - col);

      ctx.fillRect(
        pet.x + drawCol * pixelSize,
        pet.y + row * pixelSize + (pet.floatOffset || 0),
        pixelSize,
        pixelSize
      );
    }
  }
}



/**
 * 应用重力和地面碰撞
 */
function applyGravity(pet, dt, canvasHeight) {
  if (pet.isDragging) return;

  const groundY = canvasHeight - PET_SIZE;

  pet.vy += GRAVITY * dt;
  pet.y += pet.vy * dt;

  if (pet.y >= groundY) {
    pet.y = groundY;
    pet.vy = 0;
  }
}

/**
 * 限制宠物不能走出屏幕左右边界
 */
function clampToScreen(pet, canvasWidth) {
  if (pet.x < 0) {
    pet.x = 0;
  }
  if (pet.x + PET_SIZE > canvasWidth) {
    pet.x = canvasWidth - PET_SIZE;
  }
}



/**
 * 情绪状态机
 *
 * 状态流转：
 *   idle → (体力耗尽) → resting(靠墙休息) → (体力回满) → idle
 *   idle → (30s不理) → still(纯苹果不动)
 *   idle → (点击) → happy → idle
 *   idle → (连点5次) → angry → idle
 *   still/resting → (点击) → happy → idle
 */
function updateMood(pet, dt) {
  const now = Date.now();

  pet.clickTimes = pet.clickTimes.filter(t => now - t < CLICK_ANGER_WINDOW);

  // ── 生气优先 ──
  if (pet.clickTimes.length >= CLICK_ANGER_THRESHOLD && pet.mood !== 'angry') {
    pet.mood = 'angry';
    pet.moodTimer = ANGER_COOLDOWN;
    pet.animation = 'angry';
    pet.frameIndex = 0;
    pet.vx = 0;
    return;
  }

  if (pet.mood === 'angry') {
    pet.moodTimer -= dt * 1000;
    if (pet.moodTimer <= 0) {
      pet.mood = 'idle';
      pet.moodTimer = 0;
      pet.animation = 'idle';
      pet.clickTimes = [];
    }
    return;
  }

  // ── 休息状态：走向墙 → 靠墙 → 回体力 → 复活 ──
  if (pet.mood === 'resting') {
    const cw = pet._canvasWidth || window.innerWidth;
    const atLeftWall = pet.x <= 0;
    const atRightWall = pet.x + PET_SIZE >= cw;

    if (atLeftWall || atRightWall) {
      // 靠墙休息
      pet.vx = 0;
      pet.animation = 'rest';
      pet.frameIndex = pet.restSide;
    } else {
      // 还没到墙，继续走（处理被拖走后重新找墙）
      pet.restSide = pet.x < cw / 2 ? 0 : 1;
      pet.facingRight = (pet.restSide === 1);
      pet.animation = 'walk';
      pet.vx = (pet.restSide === 0 ? -1 : 1) * WALK_SPEED;
    }

    // 体力回满就起来
    if (pet.energy >= MAX_ENERGY) {
      pet.mood = 'idle';
      pet.animation = 'idle';
      pet.frameIndex = 0;
      pet.walkTimer = 0;
    }
    return;
  }

  // ── 纯苹果状态：完全不动，点一下才醒 ──
  if (pet.mood === 'still') {
    // 被点击就醒
    if (pet.clickTimes.length > 0) {
      pet.mood = 'happy';
      pet.moodTimer = HAPPY_COOLDOWN;
      pet.animation = 'happy';
      pet.frameIndex = 0;
    }
    return;
  }

  // ── 体力耗尽 → 去休息 ──
  if (pet.energy <= 0 && pet.mood === 'idle') {
    pet.mood = 'resting';
    pet.moveToNearestWall(pet._canvasWidth || window.innerWidth);
    pet.animation = 'walk';
    pet.vx = (pet.restSide === 0 ? -1 : 1) * WALK_SPEED;
    pet.facingRight = (pet.restSide === 1);
    return;
  }

  // ── 开心 ──
  if (pet.clickTimes.length > 0 && pet.mood !== 'happy') {
    const lastClick = pet.clickTimes[pet.clickTimes.length - 1];
    if (now - lastClick < 500) {
      pet.mood = 'happy';
      pet.moodTimer = HAPPY_COOLDOWN;
      pet.animation = 'happy';
      pet.frameIndex = 0;
      pet.vx = 0;
      return;
    }
  }

  if (pet.mood === 'happy') {
    pet.moodTimer -= dt * 1000;
    if (pet.moodTimer <= 0) {
      pet.mood = 'idle';
      pet.moodTimer = 0;
      pet.animation = 'idle';
    }
    return;
  }

  // ── 太久没人理 → 变回纯苹果 ──
  if (now - pet.lastInteractionTime > BORED_TIMEOUT && pet.mood === 'idle') {
    pet.mood = 'still';
    pet.animation = 'still';
    pet.frameIndex = 0;
    pet.vx = 0;
    return;
  }
}



/**
 * 判断一个坐标点是否在宠物身上
 */
function isInsidePet(px, py, pet) {
  return (
    px >= pet.x &&
    px <= pet.x + PET_SIZE &&
    py >= pet.y &&
    py <= pet.y + PET_SIZE
  );
}

/**
 * 给 Canvas 绑定鼠标事件：点击反应 + 拖拽
 *
 * @param {HTMLCanvasElement} canvas
 * @param {import('./pet.js').Pet} pet
 */
function setupInput(canvas, pet) {
  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (isInsidePet(mx, my, pet)) {
      pet.isDragging = true;
      pet.dragOffsetX = mx - pet.x;
      pet.dragOffsetY = my - pet.y;
      pet.vy = -150; // 点击时向上弹跳一下

      // 记录点击时间戳用于情绪判断
      pet.clickTimes.push(Date.now());
      const cutoff = Date.now() - 3000;
      pet.clickTimes = pet.clickTimes.filter(t => t > cutoff);

      pet.lastInteractionTime = Date.now();
    }
  });

  // 拖拽移动 — 绑定在 window 上，防止鼠标移出 Canvas 范围丢事件
  window.addEventListener('mousemove', (e) => {
    if (!pet.isDragging) return;

    const rect = canvas.getBoundingClientRect();
    pet.x = e.clientX - rect.left - pet.dragOffsetX;
    pet.y = e.clientY - rect.top - pet.dragOffsetY;
  });

  // 松开放下宠物，重力接管
  window.addEventListener('mouseup', () => {
    pet.isDragging = false;
  });
}







const canvas = document.getElementById('pet-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const pet = new Pet(canvas.width, canvas.height);
setupInput(canvas, pet);

let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  // 让状态机能感知屏幕宽度（用于判断是否靠墙）
  pet._canvasWidth = canvas.width;

  // 情绪 + 体力状态机
  updateMood(pet, dt);

  // 更新动画
  pet.updateAnimation(dt);

  // 走路 AI（idle 状态）
  pet.updateWalk(dt, canvas.width);

  // 体力消耗/恢复
  pet.updateEnergy(dt);

  // 位置更新
  pet.x += pet.vx * dt;
  applyGravity(pet, dt, canvas.height);
  clampToScreen(pet, canvas.width);

  // 渲染
  render(ctx, pet, canvas.width, canvas.height);

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);


</script>
